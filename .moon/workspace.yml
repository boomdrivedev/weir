# moon runs weir's checks. Each check is tagged with its layer, which a
# branch's policy will require by tag:
#   check-fast    format, a new place's first commit through the hooks,
#                 the Rust toolchain's pin, the specs read strictly, each
#                 open change as it would archive, and each crate's
#                 format, lint, typecheck and tests: seconds
# Each crate is a project of its own, holding its own checks (core.39); the
# root holds what spans the tree. No task reads a Markdown file of the
# tree's own but OpenSpec's validation of the specs and of each open
# change as it would archive (core.39, core.59). A task whose inputs are
# identical to a run that passed on this host, in any worktree, replays
# from .moon/cache/outputs (a link into the git common dir, made by
# devenv.nix) instead of running again.
$schema: 'https://moonrepo.dev/schemas/workspace.json'

projects:
  adapters: 'crates/weir-adapters'
  bounded: 'crates/weir-bounded'
  branch: 'crates/weir-branch'
  cadence: 'crates/weir-cadence'
  capture: 'crates/weir-capture'
  delivery: 'crates/weir-delivery'
  engine: 'crates/weir-engine'
  kinds: 'crates/weir-kinds'
  pack: 'crates/weir-pack'
  policy: 'crates/weir-policy'
  signals: 'crates/weir-signals'
  weir: 'crates/weir'
  root: '.'

# --affected compares against the merge-base with main.
vcs:
  client: 'git'
  defaultBranch: 'main'

telemetry: false
