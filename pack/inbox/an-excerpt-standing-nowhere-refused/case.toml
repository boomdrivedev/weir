# A signal whose excerpt stands nowhere in the raw file its position
# names, so not as one run beginning on its line, is refused naming its
# excerpt.
satisfies = [26]

[operation.reading]
key = "release/acme/1.1"
raw = ["raw/notes.md"]

[[operation.reading.signal]]
kind = "ask"
asserted_by = "acme"
assertion = "acme 1.1 drops the shim."
subjects = []
argues_with = []
excerpt = "The shim is gone for good."
position = "raw/notes.md:3"

[[refused]]
what = "release/acme/1.1#1"
field = "excerpt"
reason_holds = "as one run beginning on line 3"
