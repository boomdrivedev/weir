# The lamp is ticked in `off` with `r1` answering `on`. `power` moves to `on`
# taking `r1`, and the next state has applied `r1`, once (97).
satisfies = [97]
declaration = """
[kinds.lamp]
version = 1
title = "Lamp"

[kinds.lamp.regions.power]
initial = "off"

[kinds.lamp.regions.power.states.off]
decision = { kind = "switch", answers = ["on", "mode <name>"] }
transitions = [
  { when = { response = "mode <name>" }, to = "off", effects = [
    { do = "set_mode", args = { mode = "$response" } },
  ] },
  { when = { response = "on" }, to = "on" },
  { when = { ev = "lamp.switch", is = "up" }, to = "on" },
]

[kinds.lamp.regions.power.states.on]
entry = [{ do = "light" }]
machine = "bulb"
transitions = [
  { when = { final = "burnt" }, to = "off", bump = "burnouts" },
  { when = { any = [
    { ev = "lamp.faulty", is = true },
    { response = "off" },
  ] }, to = "off" },
  { when = { ev = "lamp.switch", is = "down" }, to = "off", enter = { bulb = "cold" } },
]

[kinds.lamp.regions.power.states.on.regions.level]
initial = "dim"

[kinds.lamp.regions.power.states.on.regions.level.states.dim]
transitions = [{ when = { ev = "lamp.level", gte = 5 }, to = "bright" }]

[kinds.lamp.regions.power.states.on.regions.level.states.bright]

[kinds.bulb]
version = 1
title = "Bulb"

[kinds.bulb.regions.glow]
initial = "warming"

[kinds.bulb.regions.glow.states.warming]
transitions = [
  { when = { ev = "bulb.warm", is = true }, to = "lit" },
  { when = { ev = "bulb.burnt", is = true }, to = "burnt" },
]

[kinds.bulb.regions.glow.states.lit]
transitions = [{ when = { ev = "bulb.burnt", is = true }, to = "burnt" }]

[kinds.bulb.regions.glow.states.burnt]
final = true

[kinds.bulb.regions.glow.states.cold]
final = true
entry = [{ do = "cool" }]
"""
chart = "lamp"
proofs = { light = "lamp.lit", cool = "bulb.cool" }

[state]
regions = { power = "off" }
entered_at = { power = 2026-09-04T12:00:00Z }

[snapshot]
at = 2026-09-04T12:01:00Z
responses = [{ id = "r1", answer = "on" }]

[expect]
fired = [
  { region = "power", from = "off", to = "on", response = { id = "r1", argument = "" }, effects = [
    { do = "light", region = "power", phase = "entry" },
  ] },
]

[expect.next]
regions = { power = "on", "power.on.glow" = "warming", "power.on.level" = "dim" }
entered_at = { power = 2026-09-04T12:01:00Z, "power.on.glow" = 2026-09-04T12:01:00Z, "power.on.level" = 2026-09-04T12:01:00Z }
applied = ["r1"]
