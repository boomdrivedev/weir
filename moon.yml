$schema: 'https://moonrepo.dev/schemas/project.json'

# The workspace as a whole: a candidate is held to what the commit hooks
# hold a commit to.
tasks:
  # Every formatter treefmt.nix configures, writing nothing it would change
  # and keeping no cache outside the tree. It reads every tracked file: one
  # that no formatter claims and no exclude names fails it. Its inputs are
  # the tree's files that git does not ignore: moon walks the root
  # project's globs on disk, not through git, so each entry of .gitignore
  # is negated here, and an entry added there is added here. A key naming
  # a file the tree does not hold, such as the .mcp.json and
  # .claude/settings.json devenv links in, is one sluice's check refuses
  # (boomdrivedev/sluice's C.6), as sluice's and boomdrive's format tasks
  # leave the same files out.
  format:
    command: 'treefmt --ci'
    inputs:
      - '/**/*'
      - '!/target/**'
      - '!/**/.devenv/**'
      - '!/**/.devenv.flake.nix'
      - '!/**/devenv.local.nix'
      - '!/**/.pre-commit-config.yaml'
      - '!/**/.moon/cache/**'
      - '!/result'
      - '!/result/**'
      - '!/**/.DS_Store'
      - '!/.mcp.json'
      - '!/.claude/settings.json'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # rustc, cargo, clippy-driver and rustfmt are the build .prototools pins,
  # on whichever host runs the gate (core.40). It reads the tools it checks
  # from outside the tree, so it never replays.
  toolchain:
    command: 'sh check-toolchain.sh'
    inputs: ['/check-toolchain.sh', '/.prototools', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true, cache: false}
  # Every spec under openspec/specs passes openspec validate --strict, which
  # fails a warning as an error, by the openspec devenv.nix pins (core.39,
  # core.40), as sluice, flume and boomdrive hold theirs. It is OpenSpec's
  # own validation of the files it works on, which with root:changes are
  # the tasks here that read Markdown (boomdrivedev/blueprints principle
  # 16). It sends no usage statistics and asks for no newer release.
  specs:
    command: 'openspec validate --specs --strict --no-interactive'
    env: {OPENSPEC_TELEMETRY: '0', OPENSPEC_NO_UPDATE_CHECK: '1'}
    inputs: ['/openspec/specs/**/*', '/openspec/config.yaml', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # Every open change under openspec/changes passes openspec validate
  # --strict, and archives cleanly: openspec archive applies its deltas,
  # alone, to a scratch copy of the specs, and each spec it writes passes
  # openspec validate --strict (check-changes.sh; record 0012, core.59). So
  # a change archive would refuse, or one that would archive into a spec
  # root:specs fails, such as a requirement past 500 characters, fails its
  # own branch's checks and not first at its archive. It is OpenSpec's own
  # validation, as principle 16 keeps it. The specs it is applied to are
  # inputs too; the archived changes are not.
  changes:
    command: 'sh check-changes.sh'
    inputs: ['/openspec/changes/**/*', '!/openspec/changes/archive/**/*', '/openspec/specs/**/*', '/openspec/config.yaml', '/check-changes.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # check-changes.sh does what core.59 asks of each open change: its cases,
  # each a scratch tree of its own holding the changes it names as data,
  # check its exit and its words (record 0012, core.59, core.39).
  changes-cases:
    command: 'sh check-changes-cases.sh'
    inputs: ['/check-changes.sh', '/check-changes-cases.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # A new place's first commit through the shared hooks, made before anyone
  # enters its shell (devenv.nix, `hooks`).
  hooks:
    command: 'hooks'
    inputs: ['/devenv.nix', '/devenv.yaml', '/devenv.lock', '/treefmt.nix', '/.versionrc']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
