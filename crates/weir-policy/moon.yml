$schema: 'https://moonrepo.dev/schemas/project.json'

# weir-policy: the facts, the people list and the policy (117 to 129; C.9).
# One task per check (core.39), each declaring everything it reads, a
# rule's window being weir-cadence's schedule (kit:testing.3).
language: 'rust'
dependsOn: [cadence]

tasks:
  format:
    command: 'cargo fmt -p weir-policy --check'
    inputs: &inputs ['/crates/weir-policy/**/*', '/crates/weir-cadence/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy -p weir-policy --all-targets -- -D warnings'
    inputs: *inputs
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  typecheck:
    command: 'cargo check -p weir-policy --all-targets'
    inputs: *inputs
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  test:
    command: 'cargo test -p weir-policy'
    inputs: *inputs
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
