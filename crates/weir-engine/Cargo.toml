[package]
name = "weir-engine"
description = "The engine's crate: a statechart's types, which weir-kinds reads a statechart kind into, and the engine's tick, start, decisions and names over them, each answering from its inputs with no store, no clock and no evidence of its own, moved from the original flywheel-engine onto those types (94 to 99, C.4; section 9)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
